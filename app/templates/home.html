{% extends "base.html" %}

{% block css_js %}
<link rel="stylesheet" href="{{url_for('static',filename='css/home.css')}}"> 
<link rel="preload" href="{{url_for('static',filename='css/images2/web_background.jpg')}}" as="image"/>
<script src="{{url_for('static',filename='js/home.js')}}"></script>
{% endblock %}

{% block main %}
<section class="py-5 text-center text-white">
  <div class="container">
    <h1 class="display-5 fw-bold mb-3">RBN Marketing Solutions</h1>
    <p class="lead mb-2 opacity-75">Where creative strategy meets visual impact.</p>
    <p class="lead mb-4 opacity-75">We transform ideas into content that connects, engages, and inspires.</p>
    <div class="d-flex justify-content-center gap-3 flex-wrap">
      <a class="btn btn-primary btn-lg px-4" href="https://docs.google.com/document/d/1l5XN5TqbzDIIbZCWMwQJL48IS_CYcMsvBme8XK9ZPNo/edit?usp=sharing" target="_blank" rel="noopener">View Resume</a>
      <a class="btn btn-outline-light btn-lg px-4" href="https://photos.app.goo.gl/MnYMLQn2SR9Jf48Q9" target="_blank" rel="noopener">View Photos</a>
    </div>
  </div>
  <hr class="text-white-50 mt-5">
</section>


<section class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12">
      <div class="d-flex justify-content-center gap-4 py-3">
        <img class="social-icon" src="{{url_for('static',filename='images/linkedin.svg')}}" alt="LinkedIn" onclick="window.open('http://www.linkedin.com/in/delroy-robinson-017785229','_blank')">
        <img class="social-icon" src="{{url_for('static',filename='images/github.svg')}}" alt="GitHub" onclick="window.open('https://github.com/Hominsec','_blank')">
        <img class="social-icon" src="{{url_for('static',filename='images/instagram.svg')}}" alt="Instagram" onclick="window.open('https://instagram.com/delroy_s_robinson?igshid=OGQ5ZDc2ODk2ZA==','_blank')">
      </div>
    </div>
  </div>
</section>
{% endblock %}
